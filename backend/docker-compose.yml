name: tfstate-backend

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      # State backend is used only from this host
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

volumes:
  seaweedfs-data:
