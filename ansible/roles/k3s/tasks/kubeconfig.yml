---
- name: Read admin kubeconfig from the server
  ansible.builtin.slurp:
    src: "{{ k3s_config_dir }}/k3s.yaml"
  register: k3s_admin_kubeconfig
  no_log: true

# k3s writes the loopback address; point clients at the server instead. The
# address is in tls-san, so the API certificate matches it.
- name: Write kubeconfig on the control machine
  ansible.builtin.copy:
    content: >-
      {{ k3s_admin_kubeconfig.content | b64decode
         | replace('https://127.0.0.1:' ~ k3s_api_port, 'https://' ~ ansible_host ~ ':' ~ k3s_api_port) }}
    dest: "{{ k3s_kubeconfig_local }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
