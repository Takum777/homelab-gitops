extends: default

ignore: |
  .terraform/
  **/charts/*/templates/

rules:
  # ansible-lint requires these values, see https://ansible.readthedocs.io/projects/lint/rules/yaml/
  braces:
    max-spaces-inside: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  line-length:
    max: 120
    level: warning
  document-start: disable
  comments:
    min-spaces-from-content: 1
  truthy:
    # GitHub Actions uses the bare `on:` key
    check-keys: false
